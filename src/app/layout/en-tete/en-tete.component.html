<header class="app-en-tete">
  <div class="app-en-tete__actions">
    <div class="app-en-tete__divider"></div>

    <div class="app-en-tete__profile">
      <div class="app-en-tete__avatar">{{ initiales }}</div>
      <div class="app-en-tete__profile-text">
        <span class="app-en-tete__profile-name">{{ nomComplet }}</span>
        <span class="app-en-tete__profile-role">{{ libelleRole }}</span>
      </div>
      <button
        type="button"
        class="app-en-tete__icon-btn"
        aria-label="Déconnexion"
        title="Déconnexion"
        (click)="seDeconnecter()">
        <i class="pi pi-sign-out"></i>
      </button>
    </div>
  </div>
</header>
