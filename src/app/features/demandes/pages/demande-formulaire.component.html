<div [formGroup]="formulaire" class="formulaire">
  <!-- Bascule type -->
  <div class="bascule-type">
    <button
      type="button"
      class="bascule-type__option"
      [class.bascule-type__option--actif]="type === 'INTERNE'"
      (click)="choisirType('INTERNE')">
      <i class="pi pi-building"></i> Demande interne
    </button>
    <button
      type="button"
      class="bascule-type__option"
      [class.bascule-type__option--actif]="type === 'EXTERNE'"
      (click)="choisirType('EXTERNE')">
      <i class="pi pi-globe"></i> Demande externe
    </button>
  </div>

  <!-- Objet -->
  <div class="champ">
    <label for="objet">Objet *</label>
    <input id="objet" type="text" formControlName="objet" />
  </div>

  <hr class="formulaire__separateur" />
  <h3>Informations du demandeur</h3>

  <div class="formulaire__ligne">
    <div class="champ">
      <label for="nomDemandeur">Nom *</label>
      <p-autoComplete
        inputId="nomDemandeur"
        formControlName="nomDemandeur"
        [suggestions]="suggestionsNoms"
        (completeMethod)="rechercherNoms($event)"
        [dropdown]="false"
        placeholder="Saisir ou choisir un nom"
        styleClass="w-full" />
    </div>
    <div class="champ">
      <label for="prenomDemandeur">Prénom</label>
      <p-autoComplete
        inputId="prenomDemandeur"
        formControlName="prenomDemandeur"
        [suggestions]="suggestionsPrenoms"
        (completeMethod)="rechercherPrenoms($event)"
        [dropdown]="false"
        placeholder="Saisir ou choisir un prénom"
        styleClass="w-full" />
    </div>
    <div class="champ champ--etroit">
      <label for="telephoneDemandeur">Téléphone</label>
      <input
        id="telephoneDemandeur"
        type="tel"
        formControlName="telephoneDemandeur" />
    </div>
  </div>

  @if (type === "INTERNE") {
    <div class="formulaire__ligne">
      <div class="champ champ--etroit">
        <label for="matriculeDemandeur">Matricule *</label>
        <input
          id="matriculeDemandeur"
          type="text"
          formControlName="matriculeDemandeur" />
      </div>
      <div class="champ">
        <label for="serviceDemandeur">Service *</label>
        <p-autoComplete
          inputId="serviceDemandeur"
          formControlName="serviceDemandeur"
          [suggestions]="suggestionsServices"
          (completeMethod)="rechercherServices($event)"
          [dropdown]="false"
          placeholder="Saisir ou choisir un service"
          styleClass="w-full" />
      </div>
    </div>
  } @else {
    <div class="champ">
      <label for="structureDemandeur">Structure *</label>
      <p-autoComplete
        inputId="structureDemandeur"
        formControlName="structureDemandeur"
        [suggestions]="suggestionsStructures"
        (completeMethod)="rechercherStructures($event)"
        [dropdown]="false"
        placeholder="Saisir ou choisir une structure"
        styleClass="w-full" />
    </div>
  }

  <!-- Observations -->
  <div class="champ">
    <label for="observations">Observations</label>
    <textarea
      id="observations"
      formControlName="observations"
      rows="2"></textarea>
  </div>

  <p-fieldset
    legend="La pièce justificative est obligatoire*"
    class="max-w-xs w-full">
    <div class="formulaire__ligne">
      <div class="champ champ--etroit">
        <label for="dateSouhaitee">Date souhaitée</label>
        <input id="dateSouhaitee" type="date" formControlName="dateSouhaitee" />
      </div>
      <div class="champ">
        <label>Pièce justificative</label>
        <label class="bouton-secondaire zone-fichier">
          <i class="pi pi-paperclip"></i>
          {{ nomFichierJustificatif || "Joindre un fichier" }}
          <input
            type="file"
            class="zone-fichier__input"
            (change)="surSelectionFichier($event)" />
        </label>
      </div>
    </div>
  </p-fieldset>

  <!-- Actions -->
  <div class="formulaire__actions">
    <button type="button" class="bouton-secondaire" (click)="annuler.emit()">
      Annuler
    </button>
    <button
      type="button"
      class="bouton-primaire"
      (click)="enregistrer()"
      [disabled]="enregistrement">
      @if (enregistrement) {
        <i class="pi pi-spin pi-spinner"></i>
      } @else {
        <i class="pi pi-save"></i>
      }
      Enregistrer
    </button>
  </div>
</div>
